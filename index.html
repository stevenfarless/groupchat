<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Groupchat</title>
	<link rel="stylesheet" href="./style.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
	<div id="auth-section">
		<h2>Steven's Epic Frikkin Chat for Frikkin Friks</h2>
		<form id="login-form" autocomplete="on" onsubmit="return false;">
			<input id="username" type="text" placeholder="Username" autocomplete="username" required />
			<input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
			<br /><br />
			<button onclick="login()" type="button">Login</button>
			<button onclick="signUp()" type="button">Sign Up</button>
			<p style="color: #888; font-size: 0.95em; margin-top:6px;">
				Your password is securely encrypted with industry-standard cryptography before being stored in the
				database.
			</p>
			<p id="auth-status"></p>
		</form>
	</div>
	<div id="chat-section" style="display:none; position: relative;">
		<h2>Chat</h2>
		<button id="logout-btn" onclick="logout()" aria-label="Logout">Logout</button>
		<p>Logged in as: <span id="user-info"></span></p>
		<div id="messages-container"></div>
		<form id="message-form" onsubmit="sendMessage(event)">
			<input id="message-input" placeholder="Type message..." autocomplete="off" required />
			<button type="submit">Send</button>
		</form>
	</div>
	<!-- Script order: bcrypt first, Firebase next, then your code last -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
	<script src="script.js"></script>
</body>

</html>
